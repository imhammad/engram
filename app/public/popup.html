<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: #ffffff;
        color: #22201c;
        padding: 14px 16px;
        border-radius: 10px;
        overflow: hidden;
        box-sizing: border-box;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        border: 1px solid #e5e2dc;
        border-left: 3px solid #0f6b5c;
      }
      .header {
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }
      .close-btn {
        cursor: pointer;
        color: #6b6b65;
        font-size: 16px;
        border: none;
        background: none;
        padding: 0 4px;
      }
      .close-btn:hover { color: #22201c; }
      /* Long messages wrap and stop after two lines with an ellipsis,
         rather than running off the bottom of the fixed-size window. */
      p {
        margin: 6px 0 0 0;
        font-size: 13px;
        line-height: 1.4;
        overflow: hidden;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }
    </style>

  </head>
  <body>
    <div class="header">
      <strong>Engram</strong>
      <button class="close-btn" id="close-btn">✕</button>
    </div>
    <p id="message">Engram noticed something</p>

    <script type="module">
        const { listen } = window.__TAURI__.event;

        listen("popup-message", (event) => {
            const el = document.getElementById("message");
            el.textContent = event.payload;
            el.title = event.payload; // full text on hover
        });

        document.getElementById("close-btn").addEventListener("click", () => {
            window.__TAURI__.core.invoke("hide_popup");
        });
    </script>
  </body>
</html>
